<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Rescue</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">🛒 Cart Rescue</div>

    <input
        type="text"
        id="searchBox"
        placeholder="Search dresses, kurti, t-shirts, sunglasses..."
    >

    <button onclick="openCart()" class="header-btn">
        🛒 Cart <span id="cartCount">0</span>
    </button>

    <button onclick="openAddress()" class="header-btn">
        📍 Address
    </button>

    <button onclick="logout()" class="logout-btn">
        Logout
    </button>
</header>


<!-- CATEGORY BUTTONS -->

<nav>

    <button onclick="showAll()">All</button>

    <button onclick="showCategory('Women')">
        👗 Women
    </button>

    <button onclick="showCategory('Men')">
        👕 Men
    </button>

    <button onclick="showCategory('Accessories')">
        🕶️ Accessories
    </button>

</nav>


<main>

    <h1>Fashion & Accessories</h1>

    <div id="products" class="products"></div>

</main>


<!-- CART -->

<div id="cartBox" class="side-box">

    <div class="box-header">

        <h2>🛒 My Cart</h2>

        <button onclick="closeCart()">✕</button>

    </div>

    <div id="cartItems"></div>

    <div class="cart-footer">

        <h2>
            Total:
            ₹<span id="cartTotal">0</span>
        </h2>

        <button
            class="order-btn"
            onclick="openAddress()"
        >
            Proceed to Order
        </button>

        <button
            class="clear-btn"
            onclick="clearCart()"
        >
            Clear Cart
        </button>

    </div>

</div>


<!-- ADDRESS / ORDER -->

<div id="addressModal" class="modal">

    <div class="modal-content">

        <button
            class="close-btn"
            onclick="closeAddress()"
        >
            ✕
        </button>

        <h2>📍 Delivery Address</h2>

        <form id="addressForm">

            <label>Full Name</label>

            <input
                type="text"
                id="fullName"
                placeholder="Enter full name"
                required
            >


            <label>Phone Number</label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter phone number"
                maxlength="10"
                required
            >


            <label>Door / House Number</label>

            <input
                type="text"
                id="doorNo"
                placeholder="Example: 3-30"
                required
            >


            <label>Street</label>

            <input
                type="text"
                id="street"
                placeholder="Enter street"
                required
            >


            <label>Area</label>

            <input
                type="text"
                id="area"
                placeholder="Enter area"
                required
            >


            <label>City</label>

            <input
                type="text"
                id="city"
                placeholder="Enter city"
                required
            >


            <label>State</label>

            <select id="state" required>

                <option value="">
                    Select State
                </option>

                <option value="Andhra Pradesh">
                    Andhra Pradesh
                </option>

                <option value="Telangana">
                    Telangana
                </option>

                <option value="Tamil Nadu">
                    Tamil Nadu
                </option>

                <option value="Karnataka">
                    Karnataka
                </option>

                <option value="Kerala">
                    Kerala
                </option>

            </select>


            <label>Pincode</label>

            <input
                type="text"
                id="pincode"
                placeholder="Enter 6 digit pincode"
                maxlength="6"
                required
            >


            <label>Payment Method</label>

            <select id="payment" required>

                <option value="">
                    Select Payment Method
                </option>

                <option value="Cash on Delivery">
                    Cash on Delivery
                </option>

                <option value="UPI">
                    UPI
                </option>

                <option value="Debit / Credit Card">
                    Debit / Credit Card
                </option>

            </select>


            <button
                type="submit"
                class="place-order"
            >
                📦 Confirm Order
            </button>

        </form>

    </div>

</div>


<!-- REMINDER -->

<div id="reminderPopup" class="reminder">

    <div class="reminder-content">

        <div class="reminder-icon">
            🔔
        </div>

        <h2>Cart Reminder</h2>

        <p id="reminderText"></p>

        <button onclick="closeReminder()">
            Continue Shopping
        </button>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
